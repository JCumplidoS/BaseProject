services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nextjs-app:dev
    container_name: nextjs-app-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
